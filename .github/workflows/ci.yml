name: CI/CD

# One pipeline for PRs and production (same shape as dreamteam's, adapted):
#
#   PR:            checks   (typecheck + test + build gate, one job)
#
#   push to main:  checks(+artifact) ── deploy (migrations + reuse the build, no rebuild)
#
# Differences from dreamteam, so they survive future edits:
# - npm, not bun (this repo has package-lock.json).
# - Tests run as a step in `checks`, not a separate job. They use
#   vitest.config.ts, which leaves out the Cloudflare vite plugin (that plugin
#   rejects vitest's ssr resolve.external and crashes the runner).
# - No lint job: no linter is configured in this repo.
# - Deploy applies D1 migrations first (dreamteam has no database migrations).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main-branch run mid-deploy; superseded PR runs are fair game.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Only main pushes need the build downstream (deploy). PR builds are a
      # pass/fail gate; skip the upload.
      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Workers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Installed for wrangler alone, pinned by package-lock — the same binary
      # `npm run deploy` uses locally, so no version drift between local and CI
      # deploys.
      - name: Install dependencies
        run: npm ci

      # Reuse the build from `checks` — no rebuild.
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Schema changes land with the code that needs them. wrangler tracks
      # applied migrations in D1, so this is a no-op when drizzle/ is unchanged.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply dinnertable --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The vite build writes a self-contained config (main: index.js, assets:
      # ../client, all bindings) into dist/server/ — deploy from that instead
      # of the root wrangler.jsonc, whose `main` points at the source entry
      # for the vite plugin.
      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
